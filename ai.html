<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Family AI 🤖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #101828, #18243a);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 600px;
      height: 90vh;
      background: rgba(20, 30, 48, 0.95);
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: 0.85;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      margin: 10px 0;
      padding: 13px 16px;
      border-radius: 18px;
      max-width: 85%;
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #2563eb;
      margin-right: auto;
      border-bottom-right-radius: 5px;
    }

    .ai {
      background: #29364d;
      margin-left: auto;
      border-bottom-left-radius: 5px;
    }

    .welcome {
      background: transparent;
      text-align: center;
      max-width: 100%;
      opacity: 0.9;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111827;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    #message {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 18px;
      padding: 13px 16px;
      font-size: 15px;
      background: #253249;
      color: white;
      direction: rtl;
    }

    #message::placeholder {
      color: #9ca3af;
    }

    #send {
      border: none;
      width: 50px;
      border-radius: 18px;
      background: #2563eb;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      opacity: 0.7;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>🤖 Family AI</h1>
      <p>دستیار هوش مصنوعی گروه خانوادگی</p>
    </div>

    <div id="chat">
      <div class="message welcome">
        سلام 👋<br>
        من هوش مصنوعی گروه خانوادگی هستم 🤖<br>
        هرچی می‌خوای بپرس تا کمکت کنم!
      </div>
    </div>

    <div class="input-area">
      <input
        id="message"
        type="text"
        maxlength="2000"
        placeholder="پیامت رو بنویس..."
        autocomplete="off"
      >

      <button id="send" onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script>
    const WORKER_URL =
      "https://family-ai.amirabasmine1.workers.dev/";

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");

      div.className = "message " + type;
      div.textContent = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      const typing = addMessage("🤖 در حال فکر کردن...", "ai typing");

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        typing.remove();

        if (!response.ok) {
          addMessage(
            data.reply || "❌ خطایی در ارتباط با هوش مصنوعی رخ داد.",
            "ai"
          );
          return;
        }

        addMessage(
          data.reply || "❌ پاسخی دریافت نشد.",
          "ai"
        );

      } catch (error) {

        typing.remove();

        addMessage(
          "❌ اتصال به سرور برقرار نشد. اینترنت یا Worker را بررسی کنید.",
          "ai"
        );

      } finally {

        input.disabled = false;
        sendButton.disabled = false;
        input.focus();

      }
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
